<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olive / Table</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fffdf9;--ink:#173d33;--mut:#6b6f6a;--soft:#e1eae1;--line:#e4dfd3;--warn:#f1ddd5;--redt:#a4452c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201b;--card:#17302a;--ink:#e6efe8;--mut:#9db0a6;--soft:#1f3d34;--line:#2a4a40;--warn:#4a2f27;--redt:#f0b8a4}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.serif{font-family:Lora,Georgia,serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border-radius:10px;padding:12px 18px;border:1px solid var(--ink);background:none;font-weight:500}
.btn.p{background:var(--ink);color:var(--bg)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--mut);cursor:not-allowed}
.btn:focus-visible,.cat:focus-visible{outline:3px solid #d4a017;outline-offset:2px}
.small{font-size:11px;color:var(--mut)}
.pill{background:var(--soft);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px}
nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:0 0 14px 14px;padding:12px 24px;gap:8px;flex-wrap:wrap}
.logo{letter-spacing:.22em;font-weight:600;font-size:13px}
.tabs{display:flex;gap:6px}.tab{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:500;color:var(--mut)}
.tab.on{background:var(--soft);color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-bottom:1px solid var(--line);font-size:11px;font-weight:500}
.bar span:nth-child(2){color:var(--mut);font-weight:400}
.pad{padding:28px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
/* welcome */
.welcome{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.hero{position:relative;background:linear-gradient(160deg,#c98a4b,#7d6b3b 45%,#3f5a3a);display:flex;align-items:flex-end;padding:32px}
.hero .logo{position:absolute;top:28px;left:28px;color:#fff}
.hero .emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;gap:12px;opacity:.9;padding-bottom:80px}
.quote{background:#1d4a3c;color:#fff;border-radius:14px;padding:18px 22px;position:relative}
.quote h2{font-size:26px;line-height:1.2}.quote p{font-size:12px;margin-top:8px;opacity:.9}
.side{padding:40px 8% ;display:flex;flex-direction:column;justify-content:center;gap:14px}
.side h1{font-size:46px;line-height:1.1;margin:30px 0 6px}
.side .top{display:flex;justify-content:space-between;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px;align-items:stretch}
/* gate */
.gate{display:grid;grid-template-columns:1fr 1.9fr;gap:20px;margin-top:20px}
.illus{background:var(--soft);border-radius:14px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:54px}
/* browse */
.cats{display:flex;flex-direction:column;gap:12px;min-width:120px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-size:12px;font-weight:500;text-align:center}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}
.dish{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 16px;display:flex;flex-direction:column;gap:8px}
.img{height:92px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;cursor:pointer}
.img .tag{position:absolute;top:6px;left:6px;font:500 10px Inter;background:var(--card);color:var(--ink);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.dish h3{font-size:19px}.dish .row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-weight:600}
.hint{display:flex;gap:14px;align-items:center}
.dock{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.point{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.point i{width:54px;height:54px;border-radius:50%;border:1px solid var(--ink);background:var(--soft);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
.review{background:var(--ink);color:#fff;border-radius:14px;padding:14px 26px;text-align:left;border:0;min-width:210px}
.review b{display:block}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(40,60,52,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:16px;max-width:820px;width:100%;position:relative}
.modal .pic{border-radius:14px;min-height:260px;background:linear-gradient(160deg,#d9a35c,#8a5b2d);display:flex;align-items:center;justify-content:center;font-size:110px}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:18px}
.qty{display:flex;align-items:center;background:var(--soft);border-radius:10px}
.qty button{border:0;background:none;width:34px;height:34px;font-size:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:30}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-top:18px}
.line{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .th{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px}
.line h3{flex:1;font-size:19px}
.spin{width:14px;height:14px;border:2px solid var(--ink);border-top-color:transparent;border-radius:50%;display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.qr{width:150px;height:150px;border:2px dashed var(--line);border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px}
.steps li{list-style:none;display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.steps li span{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600}
@media (max-width:760px){.welcome,.gate,.modal,.two{grid-template-columns:1fr}.hero{min-height:360px}.grid{grid-template-columns:1fr}.browse{flex-direction:column}.cats{flex-direction:row;flex-wrap:wrap}.side h1{font-size:36px}}
</style></head>
<body>
<div id="app"></div>
<script>
const ITEMS=[
{id:'burger',n:'House burger',d:'Grilled beef, tahini sauce, crisp greens and a toasted brioche bun.',l:'Flame-grilled beef, melted cheese and our house tahini sauce, layered with crisp greens in a toasted brioche bun.',ing:'Beef, brioche, cheese, lettuce, tomato, pickles, tahini sauce.',p:280,e:'🍔',bg:'linear-gradient(160deg,#d9a35c,#8a5b2d)'},
{id:'fattoush',n:'Garden fattoush',d:'Cucumber, tomato, sumac and toasted pita. Bright, honest, generous.',p:150,e:'🥗',bg:'linear-gradient(160deg,#9bb877,#4d7a45)',off:1},
{id:'juice',n:'Fresh orange juice',d:'Freshly squeezed oranges. Nothing added, just sunshine in a glass.',p:90,e:'🍹',bg:'linear-gradient(160deg,#f2b45a,#c9772b)'}];
const CATS=['Small plates','Main courses','Snacks','Drinks','Desserts'];
let S={scr:'welcome',cam:false,cat:'Main courses',cart:{},modal:null,mq:1,toast:'',undo:null,sent:false};
const $=id=>ITEMS.find(i=>i.id===id);
const cnt=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const tot=()=>Object.entries(S.cart).reduce((a,[k,v])=>a+$(k).p*v,0);
function go(s){S.scr=s;S.modal=null;render();scrollTo(0,0)}
function tip(t){S.toast=t;render();clearTimeout(window._t);window._t=setTimeout(()=>{S.toast='';render()},2200)}
function add(id,q=1){S.cart[id]=(S.cart[id]||0)+q;S.undo=id;S.modal=null;tip('Added to order');}
function undo(id){delete S.cart[id];tip('Removed from order')}
function nav(){return `<nav><span class="logo">OLIVE / TABLE</span>
<div class="tabs"><button class="tab ${['gate','browse','review','sending'].includes(S.scr)?'on':''}" onclick="go('${S.cam||S.scr=='browse'?'browse':'gate'}')">🍴 Menu</button><button class="tab ${S.scr=='rewards'?'on':''}" onclick="go('rewards')">🎁 Rewards</button><button class="tab ${S.scr=='games'?'on':''}" onclick="go('games')">🎮 Games</button></div>
<button class="btn p" onclick="go('review')">Order · ${cnt()} · EGP ${tot()}</button></nav>
<div class="bar"><span>Table 08 / &nbsp;Welcome, guest</span><span>Camera ${S.cam?'on · Hand control':'off'}</span><span>Help / Call staff</span></div>`}
function welcome(){return `<div class="welcome"><div class="hero"><span class="logo">OLIVE / TABLE</span><div class="emo">🥗🍔🍹</div>
<div class="quote"><h2>Good food.<br>Good company.</h2><p>A little of the Mediterranean, a warm Egyptian welcome.</p></div></div>
<div class="side"><div class="top"><span class="pill">✔ Table 08</span><span class="small" style="font-size:12px;color:var(--ink)">English / العربية</span></div>
<h1>A place at<br>the table.</h1><p class="small" style="font-size:13px">Settle in. Explore our menu and make yourself at home.</p>
<div class="stack"><button class="btn p" onclick="go('gate')">Continue as guest</button><p class="small">No account or personal details needed to order or play.</p><hr style="border:0;border-top:1px solid var(--line)">
<button class="btn" onclick="tip('Sign in is not part of this prototype')">Sign in</button><button class="btn" style="border:0" onclick="tip('Account creation is not part of this prototype')">Create an account</button></div>
<div style="text-align:center;margin-top:30px"><b style="font-size:12px">Help / Call staff · Table 08</b><p class="small">Camera off · Hand control is always optional</p></div></div></div>`}
function gate(){return nav()+`<div class="pad"><h1 style="font-size:36px">Your hands, your choice.</h1><p class="small" style="font-size:13px">Hand control starts only when you choose to allow the camera.</p>
<div class="gate"><div class="illus">✋<span class="pill" style="font-size:11px">✔ Camera off</span><span class="small" style="font-size:10px">Illustration only · No live camera preview</span></div>
<div class="stack"><div class="card"><b>Only your hand movements.</b><p class="small" style="font-size:13px;margin-top:10px">Hand movement is processed on this tablet. Images and video are not saved. You can turn the camera off at any time.</p><p class="small" style="font-size:13px;margin-top:10px">Touch has all the same menu and ordering options. Choosing touch will not change your order.</p></div>
<div class="card"><h2 style="font-size:24px">Prefer to use hand control?</h2><p class="small">Camera off by default. Processing stays on this device. No video is saved.</p>
<div style="display:flex;gap:12px;margin-top:14px;flex-wrap:wrap"><button class="btn p" style="flex:1" onclick="S.cam=true;go('browse')">✋ Allow camera</button><button class="btn" style="flex:1" onclick="S.cam=false;go('browse')">Use touch instead</button></div></div></div></div>
<p class="small" style="margin-top:18px">Camera permission design · Choosing Allow camera would open the device permission request in a future implementation.</p></div>`}
function browse(){const list=S.cat=='Main courses'?ITEMS:[];
const cards=list.map(i=>{const n=S.cart[i.id];return `<div class="dish"><div class="img" style="background:${i.bg}" onclick="${i.off?'':`S.modal='${i.id}';S.mq=1;render()`}">${i.e}${i.off?'<span class="tag">⦸ Not available today</span>':n?'<span class="tag">✔ Added · Undo available</span>':''}</div>
<h3>${i.n}</h3><p class="small">${i.d}</p><div class="row"><span class="price">EGP ${i.p}</span>
${i.off?'<button class="btn" disabled>Unavailable</button>':n?`<button class="btn" onclick="undo('${i.id}')">Undo</button>`:`<button class="btn" onclick="add('${i.id}')">+ Add</button>`}</div></div>`}).join('');
return nav()+`<div class="pad"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1 style="font-size:36px">A new way to browse.</h1>
<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="pill">✋ Hand control ${S.cam?'active':'off'}</span><span class="pill">✔ Camera ${S.cam?'on':'off'}</span>
${S.cam?`<button class="tab" onclick="S.cam=false;tip('Camera turned off');">Turn camera off</button>`:`<button class="tab" onclick="S.cam=true;tip('Camera turned on')">Turn camera on</button>`}<button class="btn" onclick="S.cam=false;tip('Touch control is on')">Use touch instead</button></div></div>
<div class="browse" style="display:flex;gap:14px;margin-top:20px"><div class="cats">${CATS.map(c=>`<button class="cat ${c==S.cat?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
<div class="grid">${cards||'<div class="card small" style="grid-column:1/-1;font-size:13px">More dishes in this category will appear here. Try Main courses.</div>'}</div></div>
<div class="dock"><div class="point"><i>➤</i><div><b style="font-size:12px">Pointing at House burger</b><p class="small">Target only · no action committed</p></div></div>
<p class="small" style="max-width:300px">Point at a card · Pinch + release to add<br>Palm Sweep to browse · Fist Hold for Back<br>Hover never commits · Buttons & categories also work by touch</p>
<button class="review" onclick="go('review')"><b>Review order · ${cnt()} items</b><span style="font-size:12px">EGP ${tot()} · Table 08</span></button></div></div>`}
function modal(){const i=$(S.modal);return `<div class="scrim" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal"><div class="pic" style="background:${i.bg}">${i.e}</div>
<div><button class="x" aria-label="Close" onclick="S.modal=null;render()">×</button><span class="pill" style="background:var(--warn);color:var(--redt)">HOUSE FAVOURITE</span>
<h1 style="font-size:36px;margin:14px 0 8px">${i.n}</h1><p class="small" style="font-size:13px">${i.l||i.d}</p><b style="display:block;margin-top:14px;font-size:12px">Ingredients</b><p class="small">${i.ing||'—'}</p>
<p class="small" style="margin:12px 0;font-size:12px;color:var(--ink)">ⓘ Ask staff about allergens</p><hr style="border:0;border-top:1px solid var(--line)">
<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0"><b style="font-size:20px">EGP ${i.p}</b><div class="qty"><button onclick="S.mq=Math.max(1,S.mq-1);render()">−</button><b>${S.mq}</b><button onclick="S.mq++;render()">+</button></div></div>
<button class="btn p" style="width:100%" onclick="add('${i.id}',S.mq)">+ Add to order · EGP ${i.p*S.mq}</button></div></div></div>`}
function review(){const rows=Object.entries(S.cart).map(([k,v])=>{const i=$(k);return `<div class="line"><div class="th" style="background:${i.bg}">${i.e}</div><div style="flex:1"><h3>${i.n}</h3><span class="small">${v} × EGP ${i.p}</span></div><b>EGP ${i.p*v}</b></div>`}).join('');
return nav()+`<div class="pad"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1 style="font-size:36px">Everything look good?</h1><p class="small" style="font-size:13px">Review your order before sending it to the kitchen.</p></div><button class="btn" onclick="go('browse')">Edit order</button></div>
<div class="two"><div><div class="card"><span class="pill">✔ Table 08 · ${cnt()} items</span>${rows||'<p class="small" style="padding:20px 0;font-size:13px">Your order is empty. Add a dish from the menu first.</p>'}<p style="padding-top:14px;font-weight:600;font-size:13px">Total · EGP ${tot()}</p><p class="small">All taxes and service included. Payment is handled by staff.</p></div><p class="small" style="margin-top:14px;font-size:13px">For changes after submission, please ask a member of staff.</p></div>
<div class="stack"><div class="card"><h2 style="font-size:30px;line-height:1.2">Ready for the kitchen?</h2><p class="small" style="margin:10px 0">One tap places this order. There is no payment step in this app.</p><button class="btn p" ${cnt()?'':'disabled'} onclick="place()">Place order · EGP ${tot()}</button><p class="small" style="margin-top:8px">Touch: a single, untimed tap. No hold required.</p></div>
<div class="card" style="background:var(--soft);border:0"><b style="font-size:12px;color:var(--mut)">Hand control alternative</b><p class="small" style="margin:8px 0">At this review only: point to Place order, then Pinch-Hold until confirmed. Release early to cancel. Ordinary pinch or hover will not submit.</p><span class="small">✔ Deliberate confirmation only</span></div></div></div></div>`}
function place(){S.sent=false;go('sending');setTimeout(()=>{S.sent=true;if(S.scr=='sending')render()},2200)}
function sending(){const done=S.sent;return nav()+`<div class="pad"><h1 style="font-size:36px">${done?'Order sent. Thank you!':'Sending to the kitchen…'}</h1><p class="small" style="font-size:13px">${done?'Your order reference is #T08-0142. A member of staff will bring it to Table 08.':'Please keep this screen open while we confirm your order.'}</p>
<div class="two"><div class="card">${Object.entries(S.cart).map(([k,v])=>{const i=$(k);return `<div class="line"><div class="th" style="background:${i.bg}">${i.e}</div><div style="flex:1"><h3>${i.n}</h3><span class="small">${v} × EGP ${i.p}</span></div><b>EGP ${i.p*v}</b></div>`}).join('')}<p style="padding-top:14px;font-weight:600;font-size:13px">Total · EGP ${tot()}</p></div>
<div><div class="card" style="background:var(--soft);border:0"><div style="font-size:26px">➤</div><p style="margin:6px 0"><b style="font-size:12px">${done?'✔ Order confirmed':'<span class="spin"></span> Sending your order…'}</b></p><p class="small">${done?'Your order was submitted once.':'Your order is being sent once. You can’t go back or send it again during submission.'}</p>
<button class="btn" style="width:100%;margin-top:14px;border:0;background:${done?'var(--ink)':'transparent'};color:${done?'#fff':'var(--mut)'}" ${done?`onclick="S.cart={};S.sent=false;go('browse')"`:'disabled'}>${done?'Back to menu':'Sending order…'}</button></div><p class="small" style="margin-top:12px">If the connection is lost, check the order status or call staff before trying anything else.</p></div></div></div>`}
function games(){return nav()+`<div class="pad"><h1 style="font-size:36px">Take a little play with you.</h1><p class="small" style="font-size:13px">Table Trivia · Connect your phone to this table session.</p>
<div class="two" style="grid-template-columns:1.1fr 1fr"><div><div class="card" style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap"><div class="qr">▣<br></div><div><h2 style="font-size:26px">Play on your phone</h2><span class="pill" style="margin:8px 0">Table 08 · demo session</span><p class="small">Expires in 05:00 · Demo setting. Single-use session.</p></div></div>
<p class="small" style="text-align:center;margin:18px 0;font-size:13px">Demo code · not scannable</p><div style="display:flex;gap:20px;align-items:center"><button class="btn" onclick="tip('New code created. The old one no longer works.')">New code</button><button class="tab" onclick="go('browse')">Cancel</button></div><p class="small" style="margin-top:14px">A new code invalidates the previous code. This code is only for games — never orders or payments.</p></div>
<div class="card"><h2 style="font-size:26px">Three simple steps.</h2><ul class="steps" style="padding:0"><li><span>1</span><div><b style="font-size:12px">Scan the game code</b><p class="small">Use your phone camera to open this table’s hand-off.</p></div></li><li><span>2</span><div><b style="font-size:12px">Allow Bluetooth</b><p class="small">Follow the permission prompt on your phone.</p></div></li><li><span>3</span><div><b style="font-size:12px">Wait for connection</b><p class="small">Keep your phone near the table and follow its instructions.</p></div></li></ul><hr style="border:0;border-top:1px solid var(--line)"><p class="small" style="margin-top:10px">No personal data needed. Your order stays on this tablet.</p></div></div></div>`}
function rewards(){return nav()+`<div class="pad"><h1 style="font-size:36px">Rewards.</h1><p class="small" style="font-size:13px;margin-top:6px">Create an account to collect points after each order and redeem them for treats.</p></div>`}
function render(){const m={welcome,gate,browse,review,sending,games,rewards};
document.getElementById('app').innerHTML=(m[S.scr]?m[S.scr]():welcome())+(S.modal?modal():'')+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'')}
render();
</script></body></html>
